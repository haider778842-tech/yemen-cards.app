name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev libsqlite3-dev libgdbm-dev libdb5.3-dev libbz2-dev libexpat1-dev libffi-dev libssl-dev build-essential
        pip install --upgrade buildozer cython

    - name: Initialize and Build APK
      run: |
        buildozer init
        sed -i 's/^title =.*/title = شبكة عيسى/' buildozer.spec
        sed -i 's/^requirements =.*/requirements = python3,kivy,flask,sqlite3/' buildozer.spec
        sed -i 's/#android.permissions =.*/android.permissions = READ_SMS, RECEIVE_SMS, INTERNET/' buildozer.spec
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: bin/*.apk
